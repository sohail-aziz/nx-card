<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07090d">
  <meta name="description" content="Sohail Aziz — Founder & CEO, NEXTWAVE LABS. Digital NextCard.">
  <title>Sohail Aziz — NextCard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <section class="card" aria-label="Sohail Aziz NextCard">
      <header class="hero">
        <div class="brand">
          <div class="nextcard">Next<span>Card</span></div>
          <img class="brand-logo" src="nextwave-labs-logo.png" alt="NEXTWAVE LABS logo">
        </div>

        <div class="identity">
          <div class="eyebrow">Digital Business Card</div>
          <h1>Sohail Aziz</h1>
          <div class="role">Founder &amp; CEO</div>
          <div class="org">NEXTWAVE LABS</div>
          <div class="motto">Purity · Clarity · Brilliance</div>
        </div>
      </header>

      <nav class="quick" aria-label="Quick contact actions">
        <a href="tel:+923337894902" aria-label="Call Sohail Aziz">
          <span class="emoji">☎</span><span>Call</span>
        </a>
        <a class="whatsapp" href="https://wa.me/923337894902" target="_blank" rel="noopener" aria-label="Open WhatsApp">
          <span class="emoji">◉</span><span>WhatsApp</span>
        </a>
        <a href="mailto:sohail.aziz@next-wav.com" aria-label="Email Sohail Aziz">
          <span class="emoji">✉</span><span>Email</span>
        </a>
        <a href="https://www.linkedin.com/in/sohailaziz05" target="_blank" rel="noopener" aria-label="Open LinkedIn profile">
          <span class="emoji">in</span><span>LinkedIn</span>
        </a>
      </nav>

      <section class="details">
        <a class="item" href="tel:+923337894902">
          <span class="icon">☎</span>
          <span class="copy">
            <span class="label">WhatsApp&nbsp;</span>
            <span class="value">+92 333 7894902</span>
          </span>
          <span class="chev">›</span>
        </a>

        <a class="item" href="mailto:sohail.aziz@next-wav.com">
          <span class="icon">✉</span>
          <span class="copy">
            <span class="label">Email&nbsp;</span>
            <span class="value">sohail.aziz@next-wav.com</span>
          </span>
          <span class="chev">›</span>
        </a>

        <a class="item" href="https://next-wav.com" target="_blank" rel="noopener">
          <span class="icon">◎</span>
          <span class="copy">
            <span class="label">Website&nbsp;</span>
            <span class="value">next-wav.com</span>
          </span>
          <span class="chev">›</span>
        </a>

        <a class="item" href="https://www.linkedin.com/in/sohailaziz05" target="_blank" rel="noopener">
          <span class="icon">in</span>
          <span class="copy">
            <span class="label">LinkedIn&nbsp;</span>
            <span class="value">sohailaziz05</span>
          </span>
          <span class="chev">›</span>
        </a>

        <div class="actions">
          <button class="save" type="button" onclick="saveVCF()">Save Contact</button>
          <button class="share" type="button" onclick="shareCard()">Share</button>
        </div>
      </section>
    </section>

    <div class="footer">nextcard.next-wav.com/sohailaziz</div>
  </main>

  <div id="toast" class="toast">Copied</div>

  <script>
    function saveVCF(){
      const vcard = `BEGIN:VCARD
VERSION:3.0
FN:Sohail Aziz
N:Aziz;Sohail;;;
ORG:NEXTWAVE LABS
TITLE:Founder & CEO
TEL;TYPE=CELL:+923337894902
EMAIL;TYPE=INTERNET:sohail.aziz@next-wav.com
URL:https://next-wav.com
X-SOCIALPROFILE;TYPE=linkedin:https://www.linkedin.com/in/sohailaziz05
NOTE:NextCard: https://nextcard.next-wav.com/sohailaziz
END:VCARD`;

      const blob = new Blob([vcard], {type:'text/vcard;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'Sohail_Aziz.vcf';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 1000);
    }

    async function shareCard(){
      const data = {
        title:'Sohail Aziz — NextCard',
        text:'Sohail Aziz, Founder & CEO — NEXTWAVE LABS',
        url:'https://nextcard.next-wav.com/sohailaziz'
      };
      try{
        if(navigator.share) await navigator.share(data);
        else{
          await navigator.clipboard.writeText(data.url);
          showToast('NextCard link copied');
        }
      }catch(e){}
    }

    function showToast(message){
      const t=document.getElementById('toast');
      t.textContent=message;
      t.classList.add('show');
      setTimeout(()=>t.classList.remove('show'),1800);
    }
  </script>
</body>
</html>
