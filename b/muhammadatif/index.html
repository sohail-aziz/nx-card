<html lang="en">

<body>
<main class="shell">

    <nav class="quick">
      <a href="tel:+923235484840"><span class="symbol">☎</span><span>Call</span></a>
      <a class="whatsapp" href="https://wa.me/923235484840" target="_blank" rel="noopener"><span class="symbol">◉</span><span>WhatsApp</span></a>
      <a href="mailto:atiiabbaxi@gmail.com"><span class="symbol">✉</span><span>Email</span></a>
      <a href="https://www.linkedin.com/in/muhammadatif981" target="_blank" rel="noopener"><span class="symbol">in</span><span>LinkedIn</span></a>
    </nav>

    <section class="details">
      <a class="item" href="tel:+923235484840">
        <span class="icon">☎</span>
        <span class="copy"><span class="label">Phone / WhatsApp</span><span class="value">+92 3235484840</span></span>
        <span class="chev">›</span>
      </a>
      <a class="item" href="mailto:atiiabbaxi@gmail.com">
        <span class="icon">✉</span>
        <span class="copy"><span class="label">Email</span><span class="value">atiiabbaxi@gmail.com</span></span>
        <span class="chev">›</span>
      </a>
      <a class="item" href="https://next-wav.com" target="_blank" rel="noopener">
        <span class="icon">◎</span>
        <span class="copy"><span class="label">Website</span><span class="value">next-wav.com</span></span>
        <span class="chev">›</span>
      </a>
      <a class="item" href="https://www.linkedin.com/in/muhammadatif981" target="_blank" rel="noopener">
        <span class="icon">in</span>

      <div class="actions">
        <button class="save" onclick="saveVCF()">Save Contact</button>

      </div>

  </section>
  <div class="footer">nextcard.next-wav.com/muhammadatif</div>
</main>
<div id="toast" class="toast">Copied</div>

<script>
function saveVCF(){
  const vcard = `BEGIN:VCARD
VERSION:3.0
FN:Muhammad Atif
ORG:NEXTWAVE LABS
TITLE:Builder
TEL;TYPE=CELL:+923235484840
EMAIL;TYPE=INTERNET:atiiabbaxi@gmail.com
URL:https://next-wav.com
X-SOCIALPROFILE;TYPE=linkedin:https://www.linkedin.com/in/muhammadatif981
NOTE:NextCard: https://nextcard.next-wav.com/muhammadatif
END:VCARD`;
  const blob=new Blob([vcard],{type:'text/vcard;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='muhammadatif.vcf';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function shareCard(){
  const info={title:'Muhammad Atif — NextCard',url:'https://nextcard.next-wav.com/muhammadatif'};
  try{
    if(navigator.share) await navigator.share(info);
    else{await navigator.clipboard.writeText(info.url);showToast('NextCard link copied');}
  }catch(e){}
}
function showToast(m){
  const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}
</script>
</body>
</html>
