<script>
function saveVCF(){
  const vcard = `BEGIN:VCARD
VERSION:3.0
FN:Aisha Aziz Aish
TITLE:Aisha Aziz Aish
TEL;TYPE=CELL:+923343624888
EMAIL;TYPE=INTERNET:amiaisha2@gmail.com
URL:https://next-wav.com
X-SOCIALPROFILE;TYPE=linkedin:https://www.linkedin.com/in/ami-aisha-a5a2b61a5
NOTE:NextCard: https://nextcard.next-wav.com/aishaaziz
END:VCARD`;
  const blob=new Blob([vcard],{type:'text/vcard;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='aishaaziz.vcf';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function shareCard(){
  const info={title:'Aisha Aziz Aish — NextCard',url:'https://nextcard.next-wav.com/aishaaziz'};
  try{
    if(navigator.share) await navigator.share(info);
    else{await navigator.clipboard.writeText(info.url);showToast('NextCard link copied');}
  }catch(e){}
}
function showToast(m){
  const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}
</script>
