<div id="toast" class="toast">Copied</div>

<script>
function saveVCF(){
  const vcard = `BEGIN:VCARD
VERSION:3.0
FN:Muteen Ahmad
ORG:NEXTWAVE LABS
TITLE:Driver
TEL;TYPE=CELL:+923098759043
EMAIL;TYPE=INTERNET:
URL:https://next-wav.com
X-SOCIALPROFILE;TYPE=linkedin:https://www.linkedin.com/company/nextwave-labs/
NOTE:NextCard: https://nextcard.next-wav.com/muteen-ahmad
END:VCARD`;
  const blob=new Blob([vcard],{type:'text/vcard;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='muteenahmad.vcf';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function shareCard(){
  const info={title:'Muteen Ahmad — NextCard',url:'https://nextcard.next-wav.com/muteen-ahmad'};
  try{
    if(navigator.share) await navigator.share(info);
    else{await navigator.clipboard.writeText(info.url);showToast('NextCard link copied');}
  }catch(e){}
}
function showToast(m){
  const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}
</script>
</body>
