<script>
function saveVCF(){
  const vcard = `BEGIN:VCARD
VERSION:3.0
FN:Rahat Aziz
ORG:NEXTWAVE LABS
TITLE:
TEL;TYPE=CELL:+923449675769
EMAIL;TYPE=INTERNET:azizrahat530@gmail.com

X-SOCIALPROFILE;TYPE=linkedin:https://www.linkedin.com/in/rahat-aziz-70200a444
NOTE:NextCard: https://nextcard.next-wav.com/rahataziz
END:VCARD`;
  const blob=new Blob([vcard],{type:'text/vcard;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='rahataziz.vcf';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function shareCard(){
  const info={title:'Muhammad Atif — NextCard',url:'https://nextcard.next-wav.com/rahataziz'};
  try{
    if(navigator.share) await navigator.share(info);
    else{await navigator.clipboard.writeText(info.url);showToast('NextCard link copied');}
  }catch(e){}
}
function showToast(m){
  const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}
</script>
